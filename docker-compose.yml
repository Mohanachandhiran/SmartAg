version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartag-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartag-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartag-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/smartag?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - FASTAPI_API_URL=http://ai:8000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  ai:
    build:
      context: ./backend/ai
    container_name: smartag-ai
    restart: always
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smartag-web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://api:5000/api
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=smartag_jwt_signing_secret_key_change_in_production
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
